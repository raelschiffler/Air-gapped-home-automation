- id: '1785759903161'
  alias: Girls Room LED Panel - Toggle Color
  description: ''
  triggers:
  - entity_id: light.bulb_room_girls
    from: 'off'
    to: 'on'
    trigger: state
  actions:
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ states(''sun.sun'') == ''below_horizon'' }}'
      sequence:
      - target:
          entity_id: light.bulb_room_girls
        data:
          xy_color:
          - 0.481
          - 0.395
        action: light.turn_on
    default:
    - target:
        entity_id: light.bulb_room_girls
      data:
        color_temp_kelvin: 2000
        brightness: 255
      action: light.turn_on
  mode: single
