- id: '1761163466480'
  alias: Interruptor da escada 1 espelha pra 2
  description: ''
  triggers:
  - entity_id: switch.switch_downstairs
    to:
    - 'on'
    - 'off'
    trigger: state
  conditions:
  - condition: template
    value_template: '{{ states(''switch.switch_upstairs'') != trigger.to_state.state
      }}'
  actions:
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ trigger.to_state.state == ''on'' }}'
      sequence:
      - target:
          entity_id: switch.switch_upstairs
        action: switch.turn_on
    - conditions:
      - condition: template
        value_template: '{{ trigger.to_state.state == ''off'' }}'
      sequence:
      - target:
          entity_id: switch.switch_upstairs
        action: switch.turn_off
  mode: single
- id: '1761163497200'
