- id: '1761448518395'
  alias: Frigate PTZ autotrack (entrance)
  description: ''
  triggers:
  - topic: frigate/events
    trigger: mqtt
  conditions:
  - condition: template
    value_template: "{% set e = trigger.payload_json %} {{ e['after'] is defined\n
      \  and e['after']['camera'] == 'entrance'\n   and e['after']['label'] in ['person','car','dog']
      }}\n"
  actions:
  - variables:
      e: '{{ trigger.payload_json[''after''] }}'
      x_min: '{{ e[''box''][0] | float }}'
      y_min: '{{ e[''box''][1] | float }}'
      x_max: '{{ e[''box''][2] | float }}'
      y_max: '{{ e[''box''][3] | float }}'
      fw: 640
      fh: 480
      cx: '{{ ((x_min + x_max) / 2.0) / fw }}'
      cy: '{{ ((y_min + y_max) / 2.0) / fh }}'
      dx: '{{ cx | float - 0.5 }}'
      dy: '{{ 0.5 - cy | float }}'
      dead: 0.08
      spd_x: '{{ ( (dx | abs) * 2.2 ) | min(0.8) | float }}'
      spd_y: '{{ ( (dy | abs) * 2.2 ) | min(0.8) | float }}'
      dur: 0.35
  - if:
    - condition: template
      value_template: '{{ dx | abs > dead }}'
    then:
    - action: onvif.ptz
      target:
        entity_id: camera.amc0571f_4a2f13_mediaprofile_channel1_substream1
      data:
        move_mode: ContinuousMove
        pan: '{{ ''RIGHT'' if dx|float > 0 else ''LEFT'' }}'
        speed: '{{ spd_x }}'
        continuous_duration: '{{ dur }}'
        profile: 0
  - if:
    - condition: template
      value_template: '{{ dy | abs > dead }}'
    then:
    - action: onvif.ptz
      target:
        entity_id: camera.amc0571f_4a2f13_mediaprofile_channel1_substream1
      data:
        move_mode: ContinuousMove
        tilt: '{{ ''UP'' if dy|float > 0 else ''DOWN'' }}'
        speed: '{{ spd_y }}'
        continuous_duration: '{{ dur }}'
        profile: 0
  mode: restart
- id: '1761448677532'
  alias: Frigate PTZ return to preset (front)
  description: ''
  triggers:
  - topic: frigate/events
    trigger: mqtt
  conditions:
  - condition: template
    value_template: "{% set e = trigger.payload_json %} {{ e['type'] == 'end'\n   and
      e['after'] is defined\n   and e['after']['camera'] == 'entrance' }}\n"
  actions:
  - delay: 00:00:12
  - action: onvif.goto_preset
    target:
      entity_id: camera.amc0571f_4a2f13_mediaprofile_channel1_substream1
    data:
      preset: 1
  mode: single
